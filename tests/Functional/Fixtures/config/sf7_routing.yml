# Symfony 7 reads no docblock annotations: the controllers routed by @Route docblocks are not imported here, their
# attribute twins in Controller/Attribute/ are.
paysera_fixture_test:
    resource: "@PayseraFixtureTestBundle/Resources/config/explicit_routing.xml"
    prefix:   /

paysera_fixture_attributed_test:
    resource: '@PayseraFixtureTestBundle/Resources/config/attributed_routing.xml'
    prefix:   /
